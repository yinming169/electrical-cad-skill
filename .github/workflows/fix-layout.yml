name: Fix Repository Layout

on:
  push:
    paths:
      - '.github/workflows/fix-layout.yml'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files from prompts/ to repo root and deduplicate
        run: |
          set -e
          for item in examples references scripts symbols requirements.txt push_to_github.bat push_to_github.sh; do
            if [ -e "prompts/$item" ]; then
              rm -rf "$item"
              mv "prompts/$item" "./$item"
            fi
          done
          if [ -f "prompts/SKILL.md" ]; then mv -f prompts/SKILL.md ./SKILL.md; fi
          if [ -f "prompts/README.md" ]; then mv -f prompts/README.md ./README.md; fi
          if [ -f "prompts/prompts/universal_system_prompt.md" ]; then
            mv -f prompts/prompts/universal_system_prompt.md prompts/universal_system_prompt.md
          fi
          rm -rf prompts/prompts
          python3 -c '
          from pathlib import Path
          p = Path("scripts/path_utils.py")
          txt = p.read_text(encoding="utf-8")
          txt = txt.replace("return font_manager.FontProperties(family=\"sans-serif\")", "return font_manager.FontProperties()")
          p.write_text(txt, encoding="utf-8")
          '
          rm -f .github/workflows/fix-layout.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Verify Skill environment
        run: |
          pip install matplotlib
          python3 scripts/electrical_cad_cli.py check-env
      - name: Commit and push clean layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: flatten repository structure, remove duplicates, and fix font fallback"
          git push origin main
