name: Sync EPLAN Master Specs and Terminal Generator

on:
  push:
    paths:
      - '.github/workflows/sync-eplan-master.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ezdxf
        run: pip install "ezdxf>=1.3.0"
      - name: Write EPLAN master specs, terminal/report generator, and update SKILL.md
        run: |
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          # 1. references/eplan_forms_and_terminals_spec.md
          Path("references/eplan_forms_and_terminals_spec.md").write_text(textwrap.dedent('''
          # EPLAN 端子图表、封面、目录与成套清单生成规范

          本规范固化自用户提供的 EPLAN 工程模板库（`.f01`~`.f27`、`.fn1` 及 `GRAPHICS.sdb`）。

          ## 1. 端子图表规范（`.f13` + `GRAPHICS.sdb`）
          - **单层端子**：竖版（左 `内部目标` → 中端子符号 → 右 `外部目标` + 电缆/芯线/屏蔽）；横版（上 `外部目标` → 中端子排 → 下 `内部目标`）；含无电缆版与带连接点版。
          - **双层端子**：主/副配对（带电缆/无电缆 × 竖/横版）。
          - **三层端子**：一层/二层/三层三表配对。
          - **GRAPHICS.sdb 图形符号**：常规端子、接地端子、盖板、导线/电缆符号、屏蔽、终端套管及 IEC 标准芯线色标。

          ## 2. 封面、目录与成套清单列规范
          - **项目封面（`.f26`）**：公司/客户、项目描述、图号、设计、制造商、地址、电话、项目名称、项目负责人、安装地点；底栏：编辑日期、创建者、审核人、页数。
          - **图纸目录（`.f06`）**：`页码 | 页类型 | 页描述 | 日期 | 编辑者`（5 列）。
          - **部件列表（`.f01`）**：`序号 | 标识符 | 名称 | 规格型号 | 技术参数 | 品牌 | 位置`（7 列）。
          - **部件汇总表（`.f02`）**：`序号 | 标识符 | 名称 | 规格型号 | 技术参数 | 数量 | 单位 | 品牌 | 备注`（9 列）。
          - **箱柜设备清单（`.f18`）**：`序号 | 设备标识符 | 型号 | 规格`（4 列）。
          - **电缆总览（`.f10`）**：`电缆代号 | 从 | 至 | 描述 | 电缆型号 | ø | 长度（m） | 连接数 | 线径（mm²）`（9 列）。
          - **线号统计表（`.f27`）**：`线号名称 | 数量`（2 列）。
          ''').lstrip(), encoding="utf-8")

          # 2. references/eplan_symbol_and_frame_master.md
          Path("references/eplan_symbol_and_frame_master.md").write_text(textwrap.dedent('''
          # EPLAN 符号库三级优先级与精选图框目录

          ## 1. 符号库三级调用优先级（猛哥为主，IEC/国标为辅，禁用非标）
          - **一级主库（默认首选）**：`猛哥专用符号库.sdb`（766.4 KB，875 符号 + 30 个 `MENGGE_*` 专属符号）。
          - **二级辅库（IEC/国标补充）**：`IEC_symbol.sdb`（多线）、`IEC_single_symbol.sdb`（单线）、`GB_symbol.sdb`（国标多线）、`GB_single_symbol.sdb`（国标单线）。
          - **三级系统必备库**：`SPECIAL.sdb`（跨页中断点/T 节点/电位/电缆定义线/黑盒）、`GRAPHICS.sdb`（68 个端子/电缆/盖板/屏蔽/芯线图形符号）。
          - **禁用黑名单**：原则上禁用 17 个历史遗留非标 CAD 块（`CCSYM*`、`DYDQ0201`、`DYDQ0801`、`COIL01`、`EARTH01`、`FUSE01H`、`LHB1`、`NEWCOMMONTERMIN`、`RECTANG`）。

          ## 2. 精选 EPLAN 标准图框目录（供挑选）
          | 编号 | 图框文件 | 图幅 | 风格与适用场景 |
          | :---: | :--- | :---: | :--- |
          | **F1** | `FN1_001.fn1` | A3 横 (420×297) | EPLAN 经典 IEC 工业图框（0~9 列栅格 + 底部通栏标题栏），二次原理图/PLC 图默认首选 |
          | **F2** | `GB_A3_001.fn1` / `002` | A3 横 (420×297) | 中国国标 GB A3 图框（含比例/阶段标记/标准化/工艺/批准栏），适合国内设计院审图 |
          | **F3** | `GB_A2_001.fn1` / `002` | A2 横 (594×420) | 中国国标 GB A2 大幅面图框，适合 10 kV/0.4 kV 大型一次配电系统图 |
          | **F4** | `A4 297X210横图框.fn1` | A4 横 (297×210) | 中文定制横版图框（前一页/后一页/项目名称/本页说明），适合小型控制箱与便携打印 |
          | **F5** | `GB_A4_001.fn1` / `002` | A4 竖 (210×297) | 中国国标 GB A4 竖版图框，适合封面、目录、竖版端子表与部件汇总表 |
          | **F6** | `FN1_002.fn1` / `013` | A3 横 (420×297) | EPLAN IEC 紧凑/多列报表图框，适合密集回路、电缆总览与双/三层端子图表 |
          ''').lstrip(), encoding="utf-8")

          # 3. scripts/eplan_reports_generator.py
          Path("scripts/eplan_reports_generator.py").write_text(textwrap.dedent('''
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """EPLAN 规范端子图表、封面、目录与成套清单 AutoCAD 2007 (AC1021) DXF 生成器"""
          import argparse, json
          from pathlib import Path
          import ezdxf
          from ezdxf.enums import TextEntityAlignment

          def _new_doc():
              doc = ezdxf.new("R2007", setup=True)
              doc.header["$INSUNITS"] = 4
              for lname, lw in [("01_细实线", 18), ("02_粗实线", 50), ("07_文字", 18)]:
                  if lname not in doc.layers:
                      doc.layers.add(lname, color=7, lineweight=lw)
              if "NERIN_ISOCP" not in doc.styles:
                  doc.styles.add("NERIN_ISOCP", font="simplex.shx", dxfattribs={"bigfont": "gbcbig.shx", "width": 0.75})
              return doc

          def _draw_table(msp, title, headers, widths, rows, origin=(15.0, 276.0), row_h=8.0):
              x0, y_top = origin
              tw = sum(widths)
              t = msp.add_text(title, dxfattribs={"layer": "07_文字", "style": "NERIN_ISOCP", "height": 5.0})
              t.set_placement((x0 + tw / 2.0, y_top + 4.0), align=TextEntityAlignment.MIDDLE_CENTER)
              msp.add_lwpolyline([(10, 10), (410, 10), (410, 287), (10, 287), (10, 10)], dxfattribs={"layer": "02_粗实线"})
              for r_idx, row in enumerate([headers] + rows):
                  y1, y2 = y_top - r_idx * row_h, y_top - (r_idx + 1) * row_h
                  msp.add_line((x0, y1), (x0 + tw, y1), dxfattribs={"layer": "02_粗实线" if r_idx == 0 else "01_细实线"})
                  msp.add_line((x0, y2), (x0 + tw, y2), dxfattribs={"layer": "01_细实线"})
                  cx = x0
                  for c_idx, w in enumerate(widths):
                      msp.add_line((cx, y1), (cx, y2), dxfattribs={"layer": "01_细实线"})
                      val = str(row[c_idx]) if c_idx < len(row) else ""
                      if val:
                          tx = msp.add_text(val, dxfattribs={"layer": "07_文字", "style": "NERIN_ISOCP", "height": 3.0 if r_idx == 0 else 2.6})
                          tx.set_placement((cx + w / 2.0, (y1 + y2) / 2.0), align=TextEntityAlignment.MIDDLE_CENTER)
                      cx += w
                  msp.add_line((x0 + tw, y1), (x0 + tw, y2), dxfattribs={"layer": "01_细实线"})

          def generate_terminal_diagram_dxf(spec: dict, out_dxf: Path):
              doc = _new_doc()
              msp = doc.modelspace()
              strip = spec.get("terminal_strip", "-X1")
              terms = spec.get("terminals", [])
              msp.add_lwpolyline([(10, 10), (410, 10), (410, 287), (10, 287), (10, 10)], dxfattribs={"layer": "02_粗实线"})
              title = msp.add_text(f"端子图表 {strip}（EPLAN F13 标准）", dxfattribs={"layer": "07_文字", "style": "NERIN_ISOCP", "height": 5.0})
              title.set_placement((210, 279), align=TextEntityAlignment.MIDDLE_CENTER)
              headers = ["内部目标", "内部线号", "端子号", "端子符号", "外部线号", "外部目标", "电缆/芯线", "功能描述"]
              widths = [55, 30, 22, 24, 30, 60, 75, 94]
              x0, y_top, row_h = 15.0, 270.0, 9.0
              tw = sum(widths)
              msp.add_line((x0, y_top), (x0 + tw, y_top), dxfattribs={"layer": "02_粗实线"})
              msp.add_line((x0, y_top - row_h), (x0 + tw, y_top - row_h), dxfattribs={"layer": "02_粗实线"})
              cx = x0
              for h_txt, w in zip(headers, widths):
                  msp.add_line((cx, y_top), (cx, y_top - row_h), dxfattribs={"layer": "01_细实线"})
                  t = msp.add_text(h_txt, dxfattribs={"layer": "07_文字", "style": "NERIN_ISOCP", "height": 3.0})
                  t.set_placement((cx + w / 2.0, y_top - row_h / 2.0), align=TextEntityAlignment.MIDDLE_CENTER)
                  cx += w
              msp.add_line((x0 + tw, y_top), (x0 + tw, y_top - row_h), dxfattribs={"layer": "01_细实线"})
              sym_x = x0 + sum(widths[:3]) + widths[3] / 2.0
              for idx, term in enumerate(terms):
                  y1, y2 = y_top - (idx + 1) * row_h, y_top - (idx + 2) * row_h
                  yc = (y1 + y2) / 2.0
                  msp.add_line((x0, y2), (x0 + tw, y2), dxfattribs={"layer": "01_细实线"})
                  vals = [term.get("internal_target", ""), term.get("internal_wire", ""), str(term.get("pin", idx + 1)), "", term.get("external_wire", ""), term.get("external_target", ""), term.get("cable", ""), term.get("desc", "")]
                  cx = x0
                  for val, w in zip(vals, widths):
                      msp.add_line((cx, y1), (cx, y2), dxfattribs={"layer": "01_细实线"})
                      if val:
                          t = msp.add_text(val, dxfattribs={"layer": "07_文字", "style": "NERIN_ISOCP", "height": 2.5})
                          t.set_placement((cx + w / 2.0, yc), align=TextEntityAlignment.MIDDLE_CENTER)
                      cx += w
                  msp.add_line((x0 + tw, y1), (x0 + tw, y2), dxfattribs={"layer": "01_细实线"})
                  msp.add_line((sym_x - 8, yc), (sym_x - 2.2, yc), dxfattribs={"layer": "01_细实线"})
                  msp.add_line((sym_x + 2.2, yc), (sym_x + 8, yc), dxfattribs={"layer": "01_细实线"})
                  msp.add_circle((sym_x, yc), 2.2, dxfattribs={"layer": "02_粗实线"})
                  if term.get("type") == "pe":
                      msp.add_line((sym_x - 1.5, yc - 1.5), (sym_x + 1.5, yc + 1.5), dxfattribs={"layer": "01_细实线"})
                      msp.add_line((sym_x - 1.5, yc + 1.5), (sym_x + 1.5, yc - 1.5), dxfattribs={"layer": "01_细实线"})
                  if term.get("bridge_next"):
                      msp.add_line((sym_x, yc - 2.2), (sym_x, yc - row_h + 2.2), dxfattribs={"layer": "02_粗实线"})
              aud = doc.audit()
              out_dxf.parent.mkdir(parents=True, exist_ok=True)
              doc.saveas(out_dxf, encoding="utf-8")
              return {"dxf": str(out_dxf), "dxfversion": doc.dxfversion, "audit_errors": len(aud.errors)}

          def generate_report_dxf(rtype: str, data: dict, out_dxf: Path):
              if rtype == "terminal":
                  return generate_terminal_diagram_dxf(data, out_dxf)
              doc = _new_doc()
              msp = doc.modelspace()
              presets = {
                  "toc": ("目录（EPLAN F06）", ["页码", "页类型", "页描述", "日期", "编辑者"], [35, 75, 160, 60, 60]),
                  "parts": ("部件列表（EPLAN F01）", ["序号", "标识符", "名称", "规格型号", "技术参数", "品牌", "位置"], [22, 48, 65, 85, 85, 45, 40]),
                  "bom": ("部件汇总表（EPLAN F02）", ["序号", "标识符", "名称", "规格型号", "技术参数", "数量", "单位", "品牌", "备注"], [20, 42, 58, 72, 72, 22, 20, 40, 44]),
                  "cabinet": ("箱柜设备清单（EPLAN F18）", ["序号", "设备标识符", "型号", "规格"], [35, 95, 130, 130]),
                  "cable": ("电缆总览（EPLAN F10）", ["电缆代号", "从", "至", "描述", "电缆型号", "ø", "长度(m)", "连接数", "线径(mm²)"], [38, 46, 46, 68, 68, 22, 34, 32, 36]),
                  "wires": ("线号统计表（EPLAN F27）", ["线号名称", "数量"], [200, 190]),
              }
              if rtype == "cover":
                  fields = [("公司/客户", data.get("client", "")), ("项目名称", data.get("project_name", "")), ("项目描述", data.get("project_desc", "")), ("图号", data.get("drawing_no", "")), ("设计/负责人", data.get("designer", "")), ("制造商", data.get("manufacturer", "")), ("安装地点", data.get("location", "")), ("日期/审核/页数", f"{data.get('date', '')} | {data.get('reviewer', '')} | 共{data.get('pages', '')}页")]
                  _draw_table(msp, "电气工程项目封面（EPLAN F26）", ["项目属性", "内容"], [110, 280], fields, row_h=14.0)
              else:
                  title, headers, widths = presets[rtype]
                  _draw_table(msp, title, headers, widths, data.get("rows", []))
              aud = doc.audit()
              out_dxf.parent.mkdir(parents=True, exist_ok=True)
              doc.saveas(out_dxf, encoding="utf-8")
              return {"dxf": str(out_dxf), "dxfversion": doc.dxfversion, "audit_errors": len(aud.errors)}

          if __name__ == "__main__":
              ap = argparse.ArgumentParser()
              ap.add_argument("--type", required=True, choices=["cover", "toc", "parts", "bom", "cabinet", "cable", "wires", "terminal"])
              ap.add_argument("--json", required=True)
              ap.add_argument("--out", required=True)
              args = ap.parse_args()
              print(json.dumps(generate_report_dxf(args.type, json.loads(Path(args.json).read_text(encoding="utf-8")), Path(args.out)), ensure_ascii=False, indent=2))
          ''').lstrip(), encoding="utf-8")

          # 4. Update SKILL.md
          p_sk = Path("SKILL.md")
          sk = p_sk.read_text(encoding="utf-8")
          if "eplan_symbol_and_frame_master.md" not in sk:
              sk += (
                  "\n\n## 符号库三级优先级与 EPLAN 端子/成套报表规范\n\n"
                  "- **符号优先级**：一级主库 `猛哥专用符号库`（默认首选）→ 二级辅库 `IEC_symbol` / `IEC_single_symbol` / `GB_symbol` / `GB_single_symbol` → 三级系统库 `SPECIAL` / `GRAPHICS`；原则上禁用 17 个历史非标 CAD 块（详见 `references/eplan_symbol_and_frame_master.md`）。\n"
                  "- **端子图与成套清单**：端子图表（`.f13` + `GRAPHICS.sdb`）、封面（`.f26`）、目录（`.f06`）、部件列表/汇总表（`.f01`/`.f02`）、箱柜清单（`.f18`）、电缆总览（`.f10`）与线号统计（`.f27`）严格遵循 `references/eplan_forms_and_terminals_spec.md`，调用 `scripts/eplan_reports_generator.py` 输出 AutoCAD 2007 (`AC1021`) 兼容 DXF。\n"
              )
              p_sk.write_text(sk, encoding="utf-8")
          PY
      - name: Verify terminal diagram AutoCAD 2007 export
        run: |
          python3 - <<'PY'
          import json, ezdxf
          from pathlib import Path
          import sys; sys.path.insert(0, "scripts")
          from eplan_reports_generator import generate_terminal_diagram_dxf
          sample = {
              "terminal_strip": "-X10",
              "terminals": [
                  {"internal_target": "-KM1:2", "internal_wire": "101", "pin": 1, "external_wire": "U1", "external_target": "-M1:U1", "cable": "W1 YJV-4x4", "desc": "电机U相"},
                  {"internal_target": "-KM1:4", "internal_wire": "102", "pin": 2, "external_wire": "V1", "external_target": "-M1:V1", "cable": "W1 YJV-4x4", "desc": "电机V相"},
                  {"internal_target": "-PE", "internal_wire": "PE", "pin": "PE", "type": "pe", "external_wire": "PE", "external_target": "-M1:PE", "cable": "W1 绿黄", "desc": "保护接地"},
              ]
          }
          res = generate_terminal_diagram_dxf(sample, Path("/tmp/test_term.dxf"))
          doc = ezdxf.readfile("/tmp/test_term.dxf")
          assert doc.dxfversion == "AC1021" and len(doc.audit().errors) == 0
          print("TERMINAL_VERIFIED:", res)
          PY
      - name: Cleanup workflow and push
        run: |
          rm -f .github/workflows/sync-eplan-master.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add EPLAN master symbol/frame hierarchy and terminal/report AutoCAD 2007 generator"
          git push origin main
